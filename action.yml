name: "Upload to Flipdish CDN"
description: "Upload files to both Azure Blob Storage and AWS S3 CDN containers"
author: "Flipdish"

branding:
  icon: "upload-cloud"
  color: "blue"

inputs:
  container-name:
    description: "Name of the CDN container (e.g., fonts, icons, menus)"
    required: true
  source-directory:
    description: "Local directory path containing files to upload"
    required: true
  azure-connection-string:
    description: "Azure Storage connection string"
    required: true
  aws-access-key-id:
    description: "AWS Access Key ID"
    required: true
  aws-secret-access-key:
    description: "AWS Secret Access Key"
    required: true
  dry-run:
    description: "Perform a dry run without actually uploading"
    required: false
    default: "false"
  clean-container:
    description: "Delete all files in container before uploading (clean slate)"
    required: false
    default: "false"
  purge-cdn:
    description: "Purge CDN cache for the uploaded container path after upload"
    required: false
    default: "false"
  aws-cloudfront-distribution-id:
    description: "AWS CloudFront distribution ID (required if purge-cdn is true)"
    required: false
    default: ""
  aws-cloudfront-invalidation-key-id:
    description: "AWS Access Key ID for CloudFront invalidation (required if purge-cdn is true)"
    required: false
    default: ""
  aws-cloudfront-invalidation-secret-key:
    description: "AWS Secret Access Key for CloudFront invalidation (required if purge-cdn is true)"
    required: false
    default: ""
  cloudflare-zone-id:
    description: "Cloudflare Zone ID (required if purge-cdn is true)"
    required: false
    default: ""
  cloudflare-api-token:
    description: "Cloudflare API Token with cache purge permissions (required if purge-cdn is true)"
    required: false
    default: ""
  cloudflare-cdn-hostname:
    description: "Cloudflare CDN hostname for prefix purge (e.g., cdn.flipdish.com)"
    required: false
    default: "cdn.flipdish.com"
  cloudflare-custom-domain:
    description: "Optional custom domain to also purge from Cloudflare cache (e.g., myapp.example.com)"
    required: false
    default: ""

outputs:
  azure-files-uploaded:
    description: "Number of files uploaded to Azure"
    value: ${{ steps.azure-upload.outputs.files-uploaded || steps.azure-upload-clean.outputs.files-uploaded }}
  aws-files-uploaded:
    description: "Number of files uploaded to AWS"
    value: ${{ steps.aws-upload.outputs.files-uploaded || steps.aws-upload-clean.outputs.files-uploaded }}
  azure-url:
    description: "Azure CDN URL for the container"
    value: ${{ steps.azure-upload.outputs.cdn-url || steps.azure-upload-clean.outputs.cdn-url }}
  aws-url:
    description: "AWS CDN URL for the container"
    value: ${{ steps.aws-upload.outputs.cdn-url || steps.aws-upload-clean.outputs.cdn-url }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        echo "🔍 Validating inputs..."

        if [ ! -d "${{ inputs.source-directory }}" ]; then
          echo "❌ Error: Source directory does not exist: ${{ inputs.source-directory }}"
          exit 1
        fi

        FILE_COUNT=$(find "${{ inputs.source-directory }}" -type f | wc -l)
        echo "📁 Source directory: ${{ inputs.source-directory }}"
        echo "📊 Files to upload: $FILE_COUNT"
        echo "📦 Target container: ${{ inputs.container-name }}"
        echo "🏷️  Dry run: ${{ inputs.dry-run }}"
        echo "🧹 Clean container: ${{ inputs.clean-container }}"
        echo ""

    - name: Setup Azure CLI
      shell: bash
      run: |
        echo "🔧 Checking Azure CLI..."
        if ! command -v az &> /dev/null; then
          echo "Installing Azure CLI..."
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
        fi
        az version

    - name: Setup AWS CLI
      shell: bash
      run: |
        echo "🔧 Checking AWS CLI..."
        if ! command -v aws &> /dev/null; then
          echo "Installing AWS CLI..."
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install
          rm -rf aws awscliv2.zip
        fi
        aws --version

    - name: Upload to Azure Blob Storage (Clean Container)
      if: ${{ inputs.clean-container == 'true' && inputs.dry-run != 'true' }}
      id: azure-upload-clean
      shell: bash
      env:
        AZURE_STORAGE_CONNECTION_STRING: ${{ inputs.azure-connection-string }}
      run: |
        echo "=========================================="
        echo "☁️  Uploading to Azure Blob Storage (Clean Container)"
        echo "=========================================="
        echo "Container: ${{ inputs.container-name }}"

        set -o pipefail

        # Upload files first (overwrite existing files)
        echo "📤 Uploading files to container (overwriting existing)..."
        az storage blob upload-batch \
          --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
          --destination "${{ inputs.container-name }}" \
          --source "${{ inputs.source-directory }}" \
          --overwrite true \
          --output json \
          | tee azure-upload-result.json

        if [ $? -ne 0 ]; then
          echo "❌ Failed to upload to container '${{ inputs.container-name }}'."
          echo ""
          echo "   If the container does not exist yet, you must create it first:"
          echo "   1. Add the container to configuration.ts in the flipdish-redundant-cdn repo"
          echo "   2. Deploy it to create the container in Azure and AWS"
          echo "   Repo: https://github.com/flipdishbytes/flipdish-redundant-cdn"
          exit 1
        fi

        # Count uploaded files
        FILES_UPLOADED=$(find "${{ inputs.source-directory }}" -type f | wc -l)

        # Get list of source files (relative paths from source directory)
        echo "📋 Building list of source files..."
        cd "${{ inputs.source-directory }}"
        find . -type f | sed 's|^\./||' | sort > /tmp/source-files.txt
        cd - > /dev/null

        # Get list of blobs in container
        echo "📋 Getting list of existing blobs in container..."
        az storage blob list \
          --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
          --container-name "${{ inputs.container-name }}" \
          --query "[].name" \
          --output tsv | sort > /tmp/container-files.txt || touch /tmp/container-files.txt

        # Find files to delete (in container but not in source)
        echo "🗑️  Identifying orphaned files to delete..."
        comm -13 /tmp/source-files.txt /tmp/container-files.txt > /tmp/files-to-delete.txt

        ORPHANED_COUNT=$(wc -l < /tmp/files-to-delete.txt)
        if [ "$ORPHANED_COUNT" -gt 0 ]; then
          echo "🗑️  Deleting $ORPHANED_COUNT orphaned files..."
          while IFS= read -r blob_name; do
            echo "   Deleting: $blob_name"
            az storage blob delete \
              --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
              --container-name "${{ inputs.container-name }}" \
              --name "$blob_name" \
              --output none
          done < /tmp/files-to-delete.txt
          echo "✅ Cleaned up $ORPHANED_COUNT orphaned files"
        else
          echo "✅ No orphaned files to delete"
        fi

        # Cleanup temp files
        rm -f /tmp/source-files.txt /tmp/container-files.txt /tmp/files-to-delete.txt

        # Extract storage account name from connection string for URL
        STORAGE_ACCOUNT=$(echo "$AZURE_STORAGE_CONNECTION_STRING" | grep -oP 'AccountName=\K[^;]+')

        echo "files-uploaded=$FILES_UPLOADED" >> $GITHUB_OUTPUT
        echo "cdn-url=https://$STORAGE_ACCOUNT.blob.core.windows.net/${{ inputs.container-name }}" >> $GITHUB_OUTPUT

        echo "✅ Azure upload complete: $FILES_UPLOADED files uploaded"
        echo ""

    - name: Upload to Azure Blob Storage (Normal)
      if: ${{ inputs.clean-container != 'true' || inputs.dry-run == 'true' }}
      id: azure-upload
      shell: bash
      env:
        AZURE_STORAGE_CONNECTION_STRING: ${{ inputs.azure-connection-string }}
      run: |
        echo "=========================================="
        echo "☁️  Uploading to Azure Blob Storage"
        echo "=========================================="
        echo "Container: ${{ inputs.container-name }}"

        DRY_RUN_FLAG=""
        if [ "${{ inputs.dry-run }}" == "true" ]; then
          echo "⚠️  DRY RUN MODE - No files will be uploaded"
          DRY_RUN_FLAG="--dryrun"
        fi

        # Upload files using Azure CLI with connection string
        set -o pipefail
        az storage blob upload-batch \
          --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
          --destination "${{ inputs.container-name }}" \
          --source "${{ inputs.source-directory }}" \
          --overwrite true \
          --output json \
          $DRY_RUN_FLAG \
          | tee azure-upload-result.json

        if [ $? -ne 0 ]; then
          echo "❌ Failed to upload to container '${{ inputs.container-name }}'."
          echo ""
          echo "   If the container does not exist yet, you must create it first:"
          echo "   1. Add the container to configuration.ts in the flipdish-redundant-cdn repo"
          echo "   2. Deploy it to create the container in Azure and AWS"
          echo "   Repo: https://github.com/flipdishbytes/flipdish-redundant-cdn"
          exit 1
        fi

        # Count uploaded files
        if [ "${{ inputs.dry-run }}" != "true" ]; then
          FILES_UPLOADED=$(find "${{ inputs.source-directory }}" -type f | wc -l)
        else
          FILES_UPLOADED=0
        fi

        # Extract storage account name from connection string for URL
        STORAGE_ACCOUNT=$(echo "$AZURE_STORAGE_CONNECTION_STRING" | grep -oP 'AccountName=\K[^;]+')

        echo "files-uploaded=$FILES_UPLOADED" >> $GITHUB_OUTPUT
        echo "cdn-url=https://$STORAGE_ACCOUNT.blob.core.windows.net/${{ inputs.container-name }}" >> $GITHUB_OUTPUT

        echo "✅ Azure upload complete: $FILES_UPLOADED files"
        echo ""

    - name: Upload to AWS S3 (Clean Container)
      if: ${{ inputs.clean-container == 'true' && inputs.dry-run != 'true' }}
      id: aws-upload-clean
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        AWS_REGION: "eu-west-1"
        AWS_DEFAULT_REGION: "eu-west-1"
        AWS_BUCKET_NAME: "aws-eu-west-1-cdn"
      run: |
        # CRITICAL: Unset AWS_SESSION_TOKEN if it exists
        # Session tokens are for temporary credentials only (STS/AssumeRole)
        # Using a session token with permanent IAM credentials causes InvalidClientTokenId
        unset AWS_SESSION_TOKEN

        # Verify credentials work
        echo "🔐 Verifying AWS credentials..."
        if ! aws sts get-caller-identity --region "$AWS_REGION" > /dev/null 2>&1; then
          echo "❌ Failed to authenticate with AWS"
          echo "   Check that your GitHub secrets are correct:"
          echo "   - aws-access-key-id: Should be a valid AWS Access Key ID"
          echo "   - aws-secret-access-key: Should match the Access Key ID"
          exit 1
        fi
        echo "✅ AWS credentials verified"

        echo "=========================================="
        echo "🚀 Uploading to AWS S3 (Clean Container)"
        echo "=========================================="
        echo "Bucket: $AWS_BUCKET_NAME (managed by CDN repo)"
        echo "Container: ${{ inputs.container-name }}"
        echo "Region: $AWS_REGION"

        # Upload files and delete orphaned files in one operation
        # The --delete flag removes files from destination that don't exist in source
        echo "📤 Uploading files to container and cleaning up orphaned files..."
        aws s3 sync \
          "${{ inputs.source-directory }}" \
          "s3://$AWS_BUCKET_NAME/${{ inputs.container-name }}" \
          --region "$AWS_REGION" \
          --delete

        # Count uploaded files
        FILES_UPLOADED=$(find "${{ inputs.source-directory }}" -type f | wc -l)

        echo "files-uploaded=$FILES_UPLOADED" >> $GITHUB_OUTPUT
        echo "cdn-url=https://$AWS_BUCKET_NAME.s3.$AWS_REGION.amazonaws.com/${{ inputs.container-name }}" >> $GITHUB_OUTPUT

        echo "✅ AWS upload complete: $FILES_UPLOADED files uploaded, orphaned files removed"
        echo ""

    - name: Upload to AWS S3 (Normal)
      if: ${{ inputs.clean-container != 'true' || inputs.dry-run == 'true' }}
      id: aws-upload
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        AWS_REGION: "eu-west-1"
        AWS_DEFAULT_REGION: "eu-west-1"
        AWS_BUCKET_NAME: "aws-eu-west-1-cdn"
      run: |
        # CRITICAL: Unset AWS_SESSION_TOKEN if it exists
        # Session tokens are for temporary credentials only (STS/AssumeRole)
        # Using a session token with permanent IAM credentials causes InvalidClientTokenId
        unset AWS_SESSION_TOKEN

        echo "=========================================="
        echo "🚀 Uploading to AWS S3"
        echo "=========================================="
        echo "Bucket: $AWS_BUCKET_NAME (managed by CDN repo)"
        echo "Container: ${{ inputs.container-name }}"
        echo "Region: $AWS_REGION"

        DRY_RUN_FLAG=""
        if [ "${{ inputs.dry-run }}" == "true" ]; then
          echo "⚠️  DRY RUN MODE - No files will be uploaded"
          DRY_RUN_FLAG="--dryrun"
        fi

        # Upload files using AWS CLI (uses container name as prefix)
        # Note: Bucket uses bucket policy for public access (ACLs disabled)
        aws s3 sync \
          "${{ inputs.source-directory }}" \
          "s3://$AWS_BUCKET_NAME/${{ inputs.container-name }}" \
          --region "$AWS_REGION" \
          $DRY_RUN_FLAG

        # Count uploaded files
        if [ "${{ inputs.dry-run }}" != "true" ]; then
          FILES_UPLOADED=$(find "${{ inputs.source-directory }}" -type f | wc -l)
        else
          FILES_UPLOADED=0
        fi

        echo "files-uploaded=$FILES_UPLOADED" >> $GITHUB_OUTPUT
        echo "cdn-url=https://$AWS_BUCKET_NAME.s3.$AWS_REGION.amazonaws.com/${{ inputs.container-name }}" >> $GITHUB_OUTPUT

        echo "✅ AWS upload complete: $FILES_UPLOADED files"
        echo ""

    - name: Purge CDN Cache
      if: ${{ inputs.purge-cdn == 'true' && inputs.dry-run != 'true' }}
      shell: bash
      env:
        AZURE_STORAGE_CONNECTION_STRING: ${{ inputs.azure-connection-string }}
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-cloudfront-invalidation-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-cloudfront-invalidation-secret-key }}
        AWS_REGION: "us-east-1"
        AWS_DEFAULT_REGION: "us-east-1"
      run: |
        # CRITICAL: Unset AWS_SESSION_TOKEN if it exists
        unset AWS_SESSION_TOKEN

        echo "=========================================="
        echo "🔄 Purging CDN Cache"
        echo "=========================================="
        echo "Container path: /${{ inputs.container-name }}/*"
        echo ""

        # Purge AWS CloudFront
        echo "🚀 Purging AWS CloudFront..."
        if [ -n "${{ inputs.aws-cloudfront-distribution-id }}" ] && [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
          # Invalidate container path (covers both CDN path and custom domain due to URI rewriting)
          echo "   Invalidating /${{ inputs.container-name }}/*"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ inputs.aws-cloudfront-distribution-id }}" \
            --paths "/${{ inputs.container-name }}/*" \
            --query 'Invalidation.Id' \
            --output text 2>&1)
          
          if [[ "$INVALIDATION_ID" =~ ^[A-Z0-9]+$ ]]; then
            echo "✅ AWS CloudFront invalidation created: $INVALIDATION_ID"
            echo "   View status: aws cloudfront get-invalidation --distribution-id ${{ inputs.aws-cloudfront-distribution-id }} --id $INVALIDATION_ID"
          else
            echo "⚠️  AWS CloudFront invalidation failed: $INVALIDATION_ID"
          fi
        else
          echo "⚠️  AWS CloudFront credentials not provided, skipping"
          [ -z "${{ inputs.aws-cloudfront-distribution-id }}" ] && echo "   Missing: aws-cloudfront-distribution-id"
          [ -z "$AWS_ACCESS_KEY_ID" ] && echo "   Missing: aws-cloudfront-invalidation-key-id"
          [ -z "$AWS_SECRET_ACCESS_KEY" ] && echo "   Missing: aws-cloudfront-invalidation-secret-key"
        fi
        echo ""

        # Purge Cloudflare
        echo "🌐 Purging Cloudflare..."
        if [ -n "${{ inputs.cloudflare-zone-id }}" ] && [ -n "${{ inputs.cloudflare-api-token }}" ]; then
          CDN_HOSTNAME="${{ inputs.cloudflare-cdn-hostname }}"
          CUSTOM_DOMAIN="${{ inputs.cloudflare-custom-domain }}"
          
          # Purge main CDN hostname
          echo "   Purging ${CDN_HOSTNAME}/${{ inputs.container-name }}/"
          RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ inputs.cloudflare-zone-id }}/purge_cache" \
            -H "Authorization: Bearer ${{ inputs.cloudflare-api-token }}" \
            -H "Content-Type: application/json" \
            --data "{\"prefixes\":[\"${CDN_HOSTNAME}/${{ inputs.container-name }}/\"]}")
          
          if echo "$RESPONSE" | grep -q '"success":\s*true'; then
            echo "✅ Cloudflare cache purge initiated for ${CDN_HOSTNAME}/${{ inputs.container-name }}/"
          else
            echo "⚠️  Cloudflare prefix purge failed (requires Enterprise plan)"
            echo "   Attempting purge with wildcard path..."
            
            # Fallback: try purging with files array using wildcard-style URL
            # Note: For non-Enterprise, you may need to purge specific file URLs or use purge_everything
            RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ inputs.cloudflare-zone-id }}/purge_cache" \
              -H "Authorization: Bearer ${{ inputs.cloudflare-api-token }}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')
            
            if echo "$RESPONSE" | grep -q '"success":\s*true'; then
              echo "✅ Cloudflare full cache purge completed"
            else
              echo "❌ Cloudflare cache purge failed: $RESPONSE"
            fi
          fi
          
          # Purge custom domain if provided (separate request - purge everything under the domain)
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo ""
            echo "   Purging entire custom domain: ${CUSTOM_DOMAIN}/*"
            RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ inputs.cloudflare-zone-id }}/purge_cache" \
              -H "Authorization: Bearer ${{ inputs.cloudflare-api-token }}" \
              -H "Content-Type: application/json" \
              --data "{\"prefixes\":[\"${CUSTOM_DOMAIN}\"]}")
            
            if echo "$RESPONSE" | grep -q '"success":\s*true'; then
              echo "✅ Cloudflare cache purge initiated for entire ${CUSTOM_DOMAIN}"
            else
              echo "⚠️  Cloudflare prefix purge failed for custom domain (requires Enterprise plan)"
              echo "   Response: $RESPONSE"
            fi
          fi
        else
          echo "⚠️  Cloudflare credentials not provided, skipping"
          [ -z "${{ inputs.cloudflare-zone-id }}" ] && echo "   Missing: cloudflare-zone-id"
          [ -z "${{ inputs.cloudflare-api-token }}" ] && echo "   Missing: cloudflare-api-token"
        fi
        echo ""
        echo "✅ CDN cache purge complete"
        echo ""

    - name: Summary
      shell: bash
      run: |
        echo "=========================================="
        echo "✅ CDN Upload Complete"
        echo "=========================================="
        echo "📦 Container: ${{ inputs.container-name }}"
        echo "📁 Source: ${{ inputs.source-directory }}"
        echo ""

        # Determine which step outputs to use
        if [ "${{ inputs.clean-container }}" == "true" ] && [ "${{ inputs.dry-run }}" != "true" ]; then
          AZURE_FILES="${{ steps.azure-upload-clean.outputs.files-uploaded }}"
          AZURE_URL="${{ steps.azure-upload-clean.outputs.cdn-url }}"
          AWS_FILES="${{ steps.aws-upload-clean.outputs.files-uploaded }}"
          AWS_URL="${{ steps.aws-upload-clean.outputs.cdn-url }}"
        else
          AZURE_FILES="${{ steps.azure-upload.outputs.files-uploaded }}"
          AZURE_URL="${{ steps.azure-upload.outputs.cdn-url }}"
          AWS_FILES="${{ steps.aws-upload.outputs.files-uploaded }}"
          AWS_URL="${{ steps.aws-upload.outputs.cdn-url }}"
        fi

        echo "☁️  Azure Blob Storage:"
        echo "   Files uploaded: $AZURE_FILES"
        echo "   URL: $AZURE_URL"
        echo ""
        echo "🚀 AWS S3:"
        echo "   Files uploaded: $AWS_FILES"
        echo "   URL: $AWS_URL"
        echo ""
        echo "🌐 CDN URLs:"
        echo "   https://cdn.flipdish.com/${{ inputs.container-name }}/"
        echo "   https://azure.cdn.flipdish.com/${{ inputs.container-name }}/"
        echo "   https://aws.cdn.flipdish.com/${{ inputs.container-name }}/"
        echo "   https://cloudflare.cdn.flipdish.com/${{ inputs.container-name }}/"
