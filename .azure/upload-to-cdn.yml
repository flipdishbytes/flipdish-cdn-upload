parameters:
  - name: containerName
    type: string

  - name: sourceDirectory
    type: string

  - name: dryRun
    type: boolean
    default: false

  - name: cleanContainer
    type: boolean
    default: false

  - name: purgeCdn
    type: boolean
    default: false

  - name: azureConnectionString
    type: string

  - name: awsAccessKeyId
    type: string

  - name: awsSecretAccessKey
    type: string

  - name: awsCloudfrontDistributionId
    type: string
    default: ""

  - name: awsCloudfrontInvalidationKeyId
    type: string
    default: ""

  - name: awsCloudfrontInvalidationSecretKey
    type: string
    default: ""

  - name: cloudflareZoneId
    type: string
    default: ""

  - name: cloudflareApiToken
    type: string
    default: ""

  - name: cloudflareCdnHostname
    type: string
    default: "cdn.flipdish.com"

steps:
  - task: Bash@3
    displayName: "Validate inputs"
    inputs:
      targetType: "inline"
      script: |
        echo "🔍 Validating inputs..."

        if [ -z "${{ parameters.containerName }}" ]; then
          echo "❌ Error: containerName parameter is required"
          exit 1
        fi

        if [ ! -d "${{ parameters.sourceDirectory }}" ]; then
          echo "❌ Error: Source directory does not exist: ${{ parameters.sourceDirectory }}"
          exit 1
        fi

        FILE_COUNT=$(find "${{ parameters.sourceDirectory }}" -type f | wc -l)
        echo "📁 Source directory: ${{ parameters.sourceDirectory }}"
        echo "📊 Files to upload: $FILE_COUNT"
        echo "📦 Target container: ${{ parameters.containerName }}"
        echo "🏷️  Dry run: ${{ parameters.dryRun }}"
        echo "🧹 Clean container: ${{ parameters.cleanContainer }}"
        echo ""

  - task: Bash@3
    displayName: "Setup Azure CLI"
    inputs:
      targetType: "inline"
      script: |
        echo "🔧 Checking Azure CLI..."
        if ! command -v az &> /dev/null; then
          echo "Installing Azure CLI..."
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
        fi
        az version

  - task: Bash@3
    displayName: "Setup AWS CLI"
    inputs:
      targetType: "inline"
      script: |
        echo "🔧 Checking AWS CLI..."
        if ! command -v aws &> /dev/null; then
          echo "Installing AWS CLI..."
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install
          rm -rf aws awscliv2.zip
        fi
        aws --version

  - task: Bash@3
    displayName: "Upload to Azure Blob Storage (Clean Container)"
    condition: and(succeeded(), eq('${{ parameters.cleanContainer }}', 'true'), ne('${{ parameters.dryRun }}', 'true'))
    name: "azureUploadClean"
    inputs:
      targetType: "inline"
      script: |
        echo "=========================================="
        echo "☁️  Uploading to Azure Blob Storage (Clean Container)"
        echo "=========================================="
        echo "Container: ${{ parameters.containerName }}"

        # Upload files first (overwrite existing files)
        echo "📤 Uploading files to container (overwriting existing)..."
        az storage blob upload-batch \
          --connection-string "${{ parameters.azureConnectionString }}" \
          --destination "${{ parameters.containerName }}" \
          --source "${{ parameters.sourceDirectory }}" \
          --overwrite true \
          --output json \
          | tee azure-upload-result.json

        # Count uploaded files
        FILES_UPLOADED=$(find "${{ parameters.sourceDirectory }}" -type f | wc -l)

        # Get list of source files (relative paths from source directory)
        echo "📋 Building list of source files..."
        cd "${{ parameters.sourceDirectory }}"
        find . -type f | sed 's|^\./||' | sort > /tmp/source-files.txt
        cd - > /dev/null

        # Get list of blobs in container
        echo "📋 Getting list of existing blobs in container..."
        az storage blob list \
          --connection-string "${{ parameters.azureConnectionString }}" \
          --container-name "${{ parameters.containerName }}" \
          --query "[].name" \
          --output tsv | sort > /tmp/container-files.txt || touch /tmp/container-files.txt

        # Find files to delete (in container but not in source)
        echo "🗑️  Identifying orphaned files to delete..."
        comm -13 /tmp/source-files.txt /tmp/container-files.txt > /tmp/files-to-delete.txt

        ORPHANED_COUNT=$(wc -l < /tmp/files-to-delete.txt)
        if [ "$ORPHANED_COUNT" -gt 0 ]; then
          echo "🗑️  Deleting $ORPHANED_COUNT orphaned files..."
          while IFS= read -r blob_name; do
            echo "   Deleting: $blob_name"
            az storage blob delete \
              --connection-string "${{ parameters.azureConnectionString }}" \
              --container-name "${{ parameters.containerName }}" \
              --name "$blob_name" \
              --output none
          done < /tmp/files-to-delete.txt
          echo "✅ Cleaned up $ORPHANED_COUNT orphaned files"
        else
          echo "✅ No orphaned files to delete"
        fi

        # Cleanup temp files
        rm -f /tmp/source-files.txt /tmp/container-files.txt /tmp/files-to-delete.txt

        # Extract storage account name from connection string for URL
        STORAGE_ACCOUNT=$(echo "${{ parameters.azureConnectionString }}" | grep -oP 'AccountName=\K[^;]+')

        echo "##vso[task.setvariable variable=AzureFilesUploaded]$FILES_UPLOADED"
        echo "##vso[task.setvariable variable=AzureCdnUrl]https://$STORAGE_ACCOUNT.blob.core.windows.net/${{ parameters.containerName }}"

        echo "✅ Azure upload complete: $FILES_UPLOADED files uploaded"
        echo ""

  - task: Bash@3
    displayName: "Upload to Azure Blob Storage (Normal)"
    condition: and(succeeded(), or(ne('${{ parameters.cleanContainer }}', 'true'), eq('${{ parameters.dryRun }}', 'true')))
    name: "azureUpload"
    inputs:
      targetType: "inline"
      script: |
        echo "=========================================="
        echo "☁️  Uploading to Azure Blob Storage"
        echo "=========================================="
        echo "Container: ${{ parameters.containerName }}"

        # Normalize boolean parameters (handle both string 'true' and boolean true)
        DRY_RUN=$(echo "${{ parameters.dryRun }}" | tr '[:upper:]' '[:lower:]')

        DRY_RUN_FLAG=""
        if [ "$DRY_RUN" == "true" ]; then
          echo "⚠️  DRY RUN MODE - No files will be uploaded"
          DRY_RUN_FLAG="--dryrun"
        fi

        # Upload files using Azure CLI with connection string
        az storage blob upload-batch \
          --connection-string "${{ parameters.azureConnectionString }}" \
          --destination "${{ parameters.containerName }}" \
          --source "${{ parameters.sourceDirectory }}" \
          --overwrite true \
          --output json \
          $DRY_RUN_FLAG \
          | tee azure-upload-result.json

        # Count uploaded files
        if [ "$DRY_RUN" != "true" ]; then
          FILES_UPLOADED=$(find "${{ parameters.sourceDirectory }}" -type f | wc -l)
        else
          FILES_UPLOADED=0
        fi

        # Extract storage account name from connection string for URL
        STORAGE_ACCOUNT=$(echo "${{ parameters.azureConnectionString }}" | grep -oP 'AccountName=\K[^;]+')

        echo "##vso[task.setvariable variable=AzureFilesUploaded]$FILES_UPLOADED"
        echo "##vso[task.setvariable variable=AzureCdnUrl]https://$STORAGE_ACCOUNT.blob.core.windows.net/${{ parameters.containerName }}"

        echo "✅ Azure upload complete: $FILES_UPLOADED files"
        echo ""

  - task: Bash@3
    displayName: "Upload to AWS S3 (Clean Container)"
    condition: and(succeeded(), eq('${{ parameters.cleanContainer }}', 'true'), ne('${{ parameters.dryRun }}', 'true'))
    name: "awsUploadClean"
    inputs:
      targetType: "inline"
      script: |
        echo "=========================================="
        echo "🚀 Uploading to AWS S3 (Clean Container)"
        echo "=========================================="
        echo "Bucket: aws-eu-west-1-cdn (managed by CDN repo)"
        echo "Container: ${{ parameters.containerName }}"
        echo "Region: eu-west-1"

        export AWS_ACCESS_KEY_ID="${{ parameters.awsAccessKeyId }}"
        export AWS_SECRET_ACCESS_KEY="${{ parameters.awsSecretAccessKey }}"
        export AWS_REGION="eu-west-1"
        export AWS_DEFAULT_REGION="eu-west-1"
        export AWS_BUCKET_NAME="aws-eu-west-1-cdn"

        # Upload files and delete orphaned files in one operation
        # The --delete flag removes files from destination that don't exist in source
        echo "📤 Uploading files to container and cleaning up orphaned files..."
        aws s3 sync \
          "${{ parameters.sourceDirectory }}" \
          "s3://$AWS_BUCKET_NAME/${{ parameters.containerName }}" \
          --region "$AWS_REGION" \
          --delete

        # Count uploaded files
        FILES_UPLOADED=$(find "${{ parameters.sourceDirectory }}" -type f | wc -l)

        echo "##vso[task.setvariable variable=AwsFilesUploaded]$FILES_UPLOADED"
        echo "##vso[task.setvariable variable=AwsCdnUrl]https://$AWS_BUCKET_NAME.s3.$AWS_REGION.amazonaws.com/${{ parameters.containerName }}"

        echo "✅ AWS upload complete: $FILES_UPLOADED files uploaded, orphaned files removed"
        echo ""

  - task: Bash@3
    displayName: "Upload to AWS S3 (Normal)"
    condition: and(succeeded(), or(ne('${{ parameters.cleanContainer }}', 'true'), eq('${{ parameters.dryRun }}', 'true')))
    name: "awsUpload"
    inputs:
      targetType: "inline"
      script: |
        echo "=========================================="
        echo "🚀 Uploading to AWS S3"
        echo "=========================================="
        echo "Bucket: aws-eu-west-1-cdn (managed by CDN repo)"
        echo "Container: ${{ parameters.containerName }}"
        echo "Region: eu-west-1"

        export AWS_ACCESS_KEY_ID="${{ parameters.awsAccessKeyId }}"
        export AWS_SECRET_ACCESS_KEY="${{ parameters.awsSecretAccessKey }}"
        export AWS_REGION="eu-west-1"
        export AWS_DEFAULT_REGION="eu-west-1"
        export AWS_BUCKET_NAME="aws-eu-west-1-cdn"

        # Normalize boolean parameters (handle both string 'true' and boolean true)
        DRY_RUN=$(echo "${{ parameters.dryRun }}" | tr '[:upper:]' '[:lower:]')

        DRY_RUN_FLAG=""
        if [ "$DRY_RUN" == "true" ]; then
          echo "⚠️  DRY RUN MODE - No files will be uploaded"
          DRY_RUN_FLAG="--dryrun"
        fi

        # Upload files using AWS CLI (uses container name as prefix)
        # Note: Bucket uses bucket policy for public access (ACLs disabled)
        aws s3 sync \
          "${{ parameters.sourceDirectory }}" \
          "s3://$AWS_BUCKET_NAME/${{ parameters.containerName }}" \
          --region "$AWS_REGION" \
          $DRY_RUN_FLAG

        # Count uploaded files
        if [ "$DRY_RUN" != "true" ]; then
          FILES_UPLOADED=$(find "${{ parameters.sourceDirectory }}" -type f | wc -l)
        else
          FILES_UPLOADED=0
        fi

        echo "##vso[task.setvariable variable=AwsFilesUploaded]$FILES_UPLOADED"
        echo "##vso[task.setvariable variable=AwsCdnUrl]https://$AWS_BUCKET_NAME.s3.$AWS_REGION.amazonaws.com/${{ parameters.containerName }}"

        echo "✅ AWS upload complete: $FILES_UPLOADED files"
        echo ""

  - task: Bash@3
    displayName: "Purge CDN Cache"
    condition: and(succeeded(), eq('${{ parameters.purgeCdn }}', 'true'), ne('${{ parameters.dryRun }}', 'true'))
    inputs:
      targetType: "inline"
      script: |
        echo "=========================================="
        echo "🔄 Purging CDN Cache"
        echo "=========================================="
        echo "Container path: /${{ parameters.containerName }}/*"
        echo ""

        # Purge AWS CloudFront
        echo "🚀 Purging AWS CloudFront..."
        if [ -n "${{ parameters.awsCloudfrontDistributionId }}" ] && \
           [ -n "${{ parameters.awsCloudfrontInvalidationKeyId }}" ] && \
           [ -n "${{ parameters.awsCloudfrontInvalidationSecretKey }}" ]; then
          
          export AWS_ACCESS_KEY_ID="${{ parameters.awsCloudfrontInvalidationKeyId }}"
          export AWS_SECRET_ACCESS_KEY="${{ parameters.awsCloudfrontInvalidationSecretKey }}"
          export AWS_REGION="us-east-1"
          export AWS_DEFAULT_REGION="us-east-1"
          
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ parameters.awsCloudfrontDistributionId }}" \
            --paths "/${{ parameters.containerName }}/*" \
            --query 'Invalidation.Id' \
            --output text 2>&1)
          
          if [[ "$INVALIDATION_ID" =~ ^[A-Z0-9]+$ ]]; then
            echo "✅ AWS CloudFront invalidation created: $INVALIDATION_ID"
            echo "   View status: aws cloudfront get-invalidation --distribution-id ${{ parameters.awsCloudfrontDistributionId }} --id $INVALIDATION_ID"
          else
            echo "⚠️  AWS CloudFront invalidation failed: $INVALIDATION_ID"
          fi
        else
          echo "⚠️  AWS CloudFront credentials not provided, skipping"
          [ -z "${{ parameters.awsCloudfrontDistributionId }}" ] && echo "   Missing: awsCloudfrontDistributionId"
          [ -z "${{ parameters.awsCloudfrontInvalidationKeyId }}" ] && echo "   Missing: awsCloudfrontInvalidationKeyId"
          [ -z "${{ parameters.awsCloudfrontInvalidationSecretKey }}" ] && echo "   Missing: awsCloudfrontInvalidationSecretKey"
        fi
        echo ""

        # Purge Cloudflare
        echo "🌐 Purging Cloudflare..."
        if [ -n "${{ parameters.cloudflareZoneId }}" ] && [ -n "${{ parameters.cloudflareApiToken }}" ]; then
          CDN_HOSTNAME="${{ parameters.cloudflareCdnHostname }}"
          RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ parameters.cloudflareZoneId }}/purge_cache" \
            -H "Authorization: Bearer ${{ parameters.cloudflareApiToken }}" \
            -H "Content-Type: application/json" \
            --data "{\"prefixes\":[\"${CDN_HOSTNAME}/${{ parameters.containerName }}/\"]}")
          
          if echo "$RESPONSE" | grep -q '"success":\s*true'; then
            echo "✅ Cloudflare cache purge initiated for ${CDN_HOSTNAME}/${{ parameters.containerName }}/"
          else
            echo "⚠️  Cloudflare prefix purge failed (requires Enterprise plan)"
            echo "   Attempting purge with wildcard path..."
            
            # Fallback: try purging everything for non-Enterprise plans
            RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ parameters.cloudflareZoneId }}/purge_cache" \
              -H "Authorization: Bearer ${{ parameters.cloudflareApiToken }}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')
            
            if echo "$RESPONSE" | grep -q '"success":\s*true'; then
              echo "✅ Cloudflare full cache purge completed"
            else
              echo "❌ Cloudflare cache purge failed: $RESPONSE"
            fi
          fi
        else
          echo "⚠️  Cloudflare credentials not provided, skipping"
          [ -z "${{ parameters.cloudflareZoneId }}" ] && echo "   Missing: cloudflareZoneId"
          [ -z "${{ parameters.cloudflareApiToken }}" ] && echo "   Missing: cloudflareApiToken"
        fi
        echo ""
        echo "✅ CDN cache purge complete"
        echo ""

  - task: Bash@3
    displayName: "Summary"
    inputs:
      targetType: "inline"
      script: |
        echo "=========================================="
        echo "✅ CDN Upload Complete"
        echo "=========================================="
        echo "📦 Container: ${{ parameters.containerName }}"
        echo "📁 Source: ${{ parameters.sourceDirectory }}"
        echo ""
        echo "☁️  Azure Blob Storage:"
        echo "   Files uploaded: $(AzureFilesUploaded)"
        echo "   URL: $(AzureCdnUrl)"
        echo ""
        echo "🚀 AWS S3:"
        echo "   Files uploaded: $(AwsFilesUploaded)"
        echo "   URL: $(AwsCdnUrl)"
        echo ""
        echo "🌐 CDN URLs:"
        echo "   https://cdn.flipdish.com/${{ parameters.containerName }}/"
        echo "   https://azure.cdn.flipdish.com/${{ parameters.containerName }}/"
        echo "   https://aws.cdn.flipdish.com/${{ parameters.containerName }}/"
        echo "   https://cloudflare.cdn.flipdish.com/${{ parameters.containerName }}/"
